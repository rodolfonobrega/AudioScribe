services:
  audioscribe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: audioscribe-engine
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app
      AUDIOSCRIBE_DATA_DIR: /home/audioscribe/.audioscribe
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      TRANSCRIPTION_BASE_URL: "${TRANSCRIPTION_BASE_URL:-}"
    ports:
      - "127.0.0.1:8765:8765"
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - audioscribe-data:/home/audioscribe/.audioscribe

volumes:
  audioscribe-data:
