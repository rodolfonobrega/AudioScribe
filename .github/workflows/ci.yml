name: Verify AudioScribe

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio
      - name: Security and source checks
        run: |
          python scripts/check_secrets.py
          python -m compileall -q core config main.py scripts
      - name: Python tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Install Electron dependencies deterministically
        working-directory: electron
        run: npm ci
      - name: Validate Electron entrypoints
        run: |
          node --check electron/main.js
          node --check electron/preload.js
          node --check electron/preload_e2e.js
          node --check electron/ui/app.js
          node standalone_tests/11_test_profile_shortcuts.js
      - name: Electron end-to-end UI test
        if: matrix.os == 'windows-latest'
        working-directory: electron
        run: npm run test:e2e
