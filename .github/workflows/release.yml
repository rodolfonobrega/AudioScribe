name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ matrix.os }} Binaries
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: AudioScribe-Setup.exe
            build_cmd: npm run build:win
          - os: macos-latest
            artifact_name: AudioScribe.dmg
            build_cmd: npm run build:mac
          - os: ubuntu-latest
            artifact_name: AudioScribe.AppImage
            build_cmd: npm run build:linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'electron/package-lock.json'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python Engine with PyInstaller
        run: |
          pyinstaller --onefile --name audioscribe_engine main.py

      - name: Install Electron Dependencies
        run: |
          cd electron
          npm ci || npm install

      - name: Copy Python Engine Binary to Electron Resources
        shell: bash
        run: |
          mkdir -p electron/bin
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp dist/audioscribe_engine.exe electron/bin/
          else
            cp dist/audioscribe_engine electron/bin/
            chmod +x electron/bin/audioscribe_engine
          fi

      - name: Build Desktop Application (electron-builder)
        run: |
          cd electron
          ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.AppImage
            electron/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
