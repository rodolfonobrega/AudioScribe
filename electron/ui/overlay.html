<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioScribe · Estado</title>
    <link rel="stylesheet" href="overlay.css">
</head>
<body>
    <div class="overlay-container" id="overlay-container">
        <img class="overlay-wave-art" src="assets/recording-waveform.png" alt="" aria-hidden="true">
        <div class="recording-pill">
            <span class="state-dot" id="overlay-dot"></span>
            <span class="overlay-status" id="overlay-status">Recording...</span>
            
            <!-- 5-bar Audio Visualizer Equalizer -->
            <div class="wave-equalizer" id="wave-eq" aria-hidden="true">
                <span class="bar bar1"></span>
                <span class="bar bar2"></span>
                <span class="bar bar3"></span>
                <span class="bar bar4"></span>
                <span class="bar bar5"></span>
            </div>

            <kbd class="hotkey-hint" id="hotkey-hint">Ctrl + Win</kbd>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('overlay-status');
        const dotEl = document.getElementById('overlay-dot');
        const eqBars = document.querySelectorAll('.bar');
        const hotkeyHint = document.getElementById('hotkey-hint');

        // Try to load saved shortcut on startup
        try {
            const savedShortcut = localStorage.getItem('audioscribe_shortcut');
            if (savedShortcut) hotkeyHint.textContent = savedShortcut;
        } catch (_) {}

        // --- WEB AUDIO CHIMES SYNTHESIZER ---
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playStartChime() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5 tone
                osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1); // E5 tone

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.error('Audio chime error:', e);
            }
        }

        function playStopChime() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(659.25, ctx.currentTime); // E5 tone
                osc.frequency.exponentialRampToValueAtTime(440.00, ctx.currentTime + 0.12); // A4 tone

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.18);
            } catch (e) {
                console.error('Audio chime error:', e);
            }
        }

        // Continuous animation loop for the waveform equalizer
        let animationFrame = null;
        let currentRms = 0.05;

        function animateBars() {
            const scale = Math.min(1.0, Math.max(0.15, currentRms * 15));
            eqBars.forEach((bar, idx) => {
                const heightFactor = [0.6, 1.0, 0.8, 0.9, 0.5][idx];
                const jitter = Math.sin(Date.now() * 0.02 + idx * 1.3) * 0.25;
                const amp = Math.max(0.15, scale * heightFactor + jitter);
                bar.style.transform = 'scaleY(' + amp.toFixed(2) + ')';
            });
            animationFrame = requestAnimationFrame(animateBars);
        }

        function stopAnimation() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }
            eqBars.forEach(function(bar) { bar.style.transform = 'scaleY(0.3)'; });
        }

        if (window.api && window.api.onOverlayState) {
            window.api.onOverlayState(function(state) {
                var status = state.status;
                var rms = state.rms;
                var text = state.text;
                var shortcut = state.shortcut;

                if (shortcut) {
                    // Convert Electron accelerator format to display format
                    var display = String(shortcut).replace(/Control/g, 'Ctrl').replace(/Super/g, 'Win').replace(/\s*\+\s*/g, ' + ');
                    hotkeyHint.textContent = display;
                }

                if (status === 'recording') {
                    playStartChime();
                    statusEl.textContent = 'Recording...';
                    dotEl.className = 'state-dot pulse';
                    document.getElementById('wave-eq').classList.add('recording');
                    currentRms = rms || 0.05;
                    if (!animationFrame) animateBars();
                } else if (status === 'processing') {
                    playStopChime();
                    statusEl.textContent = 'Transcribing...';
                    dotEl.className = 'state-dot yellow';
                    document.getElementById('wave-eq').classList.remove('recording');
                    stopAnimation();
                } else if (status === 'done') {
                    if (state.isSilent || (text && text.includes('Silence'))) {
                        statusEl.textContent = 'Silence Captured';
                        dotEl.className = 'state-dot yellow';
                    } else if (state.isError || (text && text.includes('Error'))) {
                        statusEl.textContent = text || 'Error';
                        dotEl.className = 'state-dot red';
                    } else {
                        statusEl.textContent = 'Done!';
                        dotEl.className = 'state-dot green';
                    }
                    document.getElementById('wave-eq').classList.remove('recording');
                    stopAnimation();
                }
            });
        }
    </script>
</body>
</html>
