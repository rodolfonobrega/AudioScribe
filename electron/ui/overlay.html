<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AudioScribe Floating Overlay</title>
    <link rel="stylesheet" href="overlay.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="overlay-container" id="overlay-container">
        <div class="recording-pill">
            <span class="red-dot" id="overlay-dot"></span>
            <span class="overlay-status" id="overlay-status">Recording...</span>
            
            <!-- 5-bar Audio Visualizer Equalizer -->
            <div class="wave-equalizer" id="wave-eq">
                <span class="bar bar1"></span>
                <span class="bar bar2"></span>
                <span class="bar bar3"></span>
                <span class="bar bar4"></span>
                <span class="bar bar5"></span>
            </div>

            <span class="hotkey-hint" id="hotkey-hint">F9</span>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('overlay-status');
        const dotEl = document.getElementById('overlay-dot');
        const eqBars = document.querySelectorAll('.bar');
        const hotkeyHint = document.getElementById('hotkey-hint');

        // --- WEB AUDIO CHIMES SYNTHESIZER ---
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playStartChime() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5 tone
                osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.1); // E5 tone

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                console.error('Audio chime error:', e);
            }
        }

        function playStopChime() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(659.25, ctx.currentTime); // E5 tone
                osc.frequency.exponentialRampToValueAtTime(440.00, ctx.currentTime + 0.12); // A4 tone

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.18);
            } catch (e) {
                console.error('Audio chime error:', e);
            }
        }

        if (window.api && window.api.onOverlayState) {
            window.api.onOverlayState(({ status, rms, text, shortcut }) => {
            if (shortcut) {
                hotkeyHint.textContent = shortcut;
            }

            if (status === 'recording') {
                playStartChime();
                statusEl.textContent = 'Recording...';
                dotEl.className = 'red-dot pulse';
                
                // Animate bars based on live RMS volume
                const scale = Math.min(1.0, Math.max(0.15, (rms || 0.05) * 15));
                eqBars.forEach((bar, idx) => {
                    const heightFactor = [0.6, 1.0, 0.8, 0.9, 0.5][idx];
                    bar.style.transform = `scaleY(${Math.max(0.2, scale * heightFactor * (0.8 + Math.random() * 0.4))})`;
                });
            } else if (status === 'processing') {
                playStopChime();
                statusEl.textContent = 'Transcribing...';
                dotEl.className = 'red-dot yellow';
                eqBars.forEach(bar => bar.style.transform = 'scaleY(0.3)');
            } else if (status === 'done') {
                statusEl.textContent = text ? `Pasted!` : 'Done!';
                dotEl.className = 'red-dot green';
            }
        });
    </script>
</body>
</html>
